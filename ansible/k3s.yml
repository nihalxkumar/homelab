---
- name: Install K3s (Single Node)
  hosts: vps
  become: true
  vars_files:
    - inventory/host_vars/vps.yml

  tasks:
    # Pods remain unable to swap; this file protects host services during
    # short memory spikes so the kernel does not kill SSH or Tailscale.
    - name: System | Check Swap File
      stat:
        path: /swapfile
      register: swap_file

    - name: System | Disable Undersized Swap File
      command: swapoff /swapfile
      register: swapoff_result
      changed_when: swapoff_result.rc == 0
      failed_when: false
      when:
        - swap_file.stat.exists
        - swap_file.stat.size != 6 * 1024 * 1024 * 1024

    - name: System | Allocate Swap File
      command: fallocate -l 6G /swapfile
      when: not swap_file.stat.exists or swap_file.stat.size != 6 * 1024 * 1024 * 1024

    - name: System | Secure Swap File
      file:
        path: /swapfile
        mode: "0600"

    - name: System | Format Swap File
      command: mkswap /swapfile
      when: not swap_file.stat.exists or swap_file.stat.size != 6 * 1024 * 1024 * 1024

    - name: System | Persist Swap File
      lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0
        state: present

    - name: System | Enable Swap File
      command: swapon /swapfile
      when: ansible_facts['swaptotal_mb'] == 0 or not swap_file.stat.exists or swap_file.stat.size != 6 * 1024 * 1024 * 1024

    # Keep interactive tools such as compilers inside a boundary. Without it,
    # one Tree-sitter parser build can consume more memory than the cluster.
    - name: System | Create User Memory Limit Directory
      file:
        path: /etc/systemd/system/user-1000.slice.d
        state: directory
        mode: "0755"

    - name: System | Limit Interactive User Memory
      copy:
        dest: /etc/systemd/system/user-1000.slice.d/memory.conf
        content: |
          [Slice]
          MemoryHigh=1G
          MemoryMax=1536M
          MemorySwapMax=4G
        owner: root
        group: root
        mode: "0644"
      notify: Reload Systemd

    - name: System | Install Prerequisites
      apt:
        name:
          - curl
          - open-iscsi # Required for Longhorn/storage later
          - nfs-common # Required for some PVs
        state: present
        update_cache: yes

    - name: K3s | Install K3s
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server {{ k3s_server_args }}

    - name: K3s | Wait for Node to be Ready
      command: /usr/local/bin/k3s kubectl get nodes
      register: nodes_check
      until: '"Ready" in nodes_check.stdout'
      retries: 30
      delay: 5

    - name: Local | Setup Kubeconfig for User
      file:
        path: "/home/{{ k3s_admin_user }}/.kube"
        state: directory
        owner: "{{ k3s_admin_user }}"
        group: "{{ k3s_admin_user }}"
        mode: "0755"

    - name: Local | Copy Kubeconfig to User Home
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ k3s_admin_user }}/.kube/config"
        remote_src: yes
        owner: "{{ k3s_admin_user }}"
        group: "{{ k3s_admin_user }}"
        mode: "0600"

    - name: Local | Update Kubeconfig Server Address
      replace:
        path: "/home/{{ k3s_admin_user }}/.kube/config"
        regexp: "127.0.0.1"
        replace: "{{ ansible_host }}"

    - name: Fetch | Get Kubeconfig to Local Machine
      fetch:
        src: "/home/{{ k3s_admin_user }}/.kube/config" # <--- Changed from /etc/rancher...
        dest: "./k3s-vps.yaml"
        flat: yes

  handlers:
    - name: Reload Systemd
      systemd:
        daemon_reload: true

# Keep cluster DNS resilient to a NextDNS outage. Imported here so every
# `just provision` re-applies the Quad9 fallback, including after a k3s upgrade
# that regenerates the bundled coredns.yaml and would otherwise revert it.
- import_playbook: coredns-resilient-dns.yml
