---
- name: Install and Configure Tailscale
  hosts: vps
  become: true

  tasks:
    - name: Add Tailscale GPG key
      get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg

    - name: Add Tailscale repository
      get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.tailscale-keyring.list
        dest: /etc/apt/sources.list.d/tailscale.list

    - name: Install Tailscale
      apt:
        update_cache: yes
        name: tailscale
        state: latest

    - name: Enable Tailscale service
      service:
        name: tailscaled
        state: started
        enabled: yes

    # One-time bootstrap: authenticate with auth key and set all preferences.
    # Pass via: just run-playbook tailscale.yml -e tailscale_auth_key=tskey-xxx
    - name: Authenticate Tailscale with tags, SSH, and DNS (one-time)
      command: tailscale up --authkey={{ tailscale_auth_key }} --reset --hostname=maya --advertise-tags=tag:k8s --ssh --accept-dns=true --accept-risk=lose-ssh
      register: tailscale_start
      changed_when: "'Success' in tailscale_start.stdout"
      ignore_errors: yes
      when: tailscale_auth_key is defined

    # Idempotent: update all preferences on already-authenticated nodes.
    # --reset clears previous preferences so we don't need to restate every non-default flag.
    # --accept-risk=lose-ssh acknowledges that enabling Tailscale SSH may disconnect
    # the current session if Ansible is connected over the Tailscale interface.
    - name: Update Tailscale tags, SSH, and DNS
      command: tailscale up --reset --hostname=maya --advertise-tags=tag:k8s --ssh --accept-dns=true --accept-risk=lose-ssh
      register: tailscale_update
      changed_when: "'Success' in tailscale_update.stdout or tailscale_update.rc == 0"
      ignore_errors: yes
      when: tailscale_auth_key is not defined

    - name: Display Tailscale status
      command: tailscale status
      become: no
      register: tailscale_status
      changed_when: false

    - name: Show Tailscale connection info
      debug:
        msg: "{{ tailscale_status.stdout_lines[-3:] }}"
