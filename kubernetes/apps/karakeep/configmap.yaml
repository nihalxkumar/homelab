apiVersion: v1
kind: ConfigMap
metadata:
  name: karakeep-config
  namespace: karakeep
data:
  NEXTAUTH_URL: "https://karakeep.nihalxkumar.dev"
  OPENAI_BASE_URL: "https://api.groq.com/openai/v1"
  MEILI_ADDR: "http://karakeep-meilisearch:7700"
  REDIS_URL: "redis://karakeep-redis:6379"
  DATA_DIR: "/data"
  LOG_LEVEL: "info"
  # Automatic Tagging
  INFERENCE_TEXT_MODEL: "llama-3.1-8b-instant"
  INFERENCE_IMAGE_MODEL: "llama-3.1-8b-instant"
  INFERENCE_ENABLE_AUTO_TAGGING: "true"
  INFERENCE_OUTPUT_SCHEMA: "json"
  # Browser for crawling
  BROWSER_WEB_URL: "http://karakeep-chrome:9222"
