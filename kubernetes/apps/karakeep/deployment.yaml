apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
  annotations:
    glance/url: ""
    glance/icon: si:gitbook
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep
  template:
    metadata:
      labels:
        app: karakeep
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: karakeep
          image: ghcr.io/karakeep-app/karakeep:release
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: karakeep-config
            - secretRef:
                name: karakeep-secrets
          env:
            # Cap V8 old-space so Next.js doesn't sit at ~550Mi RSS on a 6Gi node.
            # 384 leaves headroom under the 512Mi limit for non-heap RSS.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-data
