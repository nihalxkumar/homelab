apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  annotations:
    glance/url: ""
    glance/icon: si:jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "UTC"
          ports:
            - containerPort: 8096
              name: http
          volumeMounts:
            - name: data
              mountPath: /config
              subPath: jellyfin-config
            - name: data
              mountPath: /cache
              subPath: jellyfin-cache
            - name: data
              mountPath: /media
              subPath: media
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              # Capped at 1 vCPU so a transcode can't starve the rest of the
              # node's 5 vCPUs. No hardware transcoding available on this VPS
              # (no GPU) - prefer Direct Play on clients where possible.
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: media-data
