apiVersion: v1
kind: ServiceAccount
metadata:
  name: qbittorrent-autostop
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qbittorrent-autostop
  namespace: media
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qbittorrent-autostop
  namespace: media
subjects:
  - kind: ServiceAccount
    name: qbittorrent-autostop
    namespace: media
roleRef:
  kind: Role
  name: qbittorrent-autostop
  apiGroup: rbac.authorization.k8s.io
