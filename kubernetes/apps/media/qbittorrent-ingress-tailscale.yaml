apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent-tailscale
  namespace: media
  annotations:
    # NEVER set this to "true" - the WebUI must stay tailnet-only.
    tailscale.com/funnel: "false"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - qbittorrent
  rules:
    - host: qbittorrent
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 80
