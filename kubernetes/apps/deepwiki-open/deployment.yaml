apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepwiki
  labels:
    app: deepwiki
spec:
  # Decommissioned — keep at 0. Live cluster had drifted to 1; git is source of truth.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deepwiki
  template:
    metadata:
      labels:
        app: deepwiki
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        fsGroup: 0 # Root user required? Image seems to run as root by default from docker-compose volume mapping /root
      containers:
      - name: deepwiki
        image: ghcr.io/asyncfuncai/deepwiki-open:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: ui
          containerPort: 3000
          protocol: TCP
        - name: api
          containerPort: 8001
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: deepwiki-config
        - secretRef:
            name: deepwiki-secret
        
        volumeMounts:
        - name: data
          mountPath: /root/.adalflow # Mapped from docker-compose.yml
        
        # Clamped for 6Gi node if ever re-enabled (was 1Gi/4Gi — absurd overcommit).
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        
        # Health check from docker-compose
        livenessProbe:
          exec:
            command:
            - curl
            - -f
            - http://localhost:8001/health
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
          
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: deepwiki-data
