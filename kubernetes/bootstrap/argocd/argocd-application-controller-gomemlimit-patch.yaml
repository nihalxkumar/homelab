# Cap memory for application-controller on a 6Gi single-node.
# GOMEMLIMIT tells the Go runtime to GC before RSS hits the K8s limit.
# StatefulSet target — see kustomization.yaml patches.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-application-controller
          env:
            - name: GOMEMLIMIT
              value: "400MiB"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
